# Release: build, publish the GitHub Release, and update the Homebrew formula.
#
# This repo had NO release automation. .goreleaser.yaml declared a brews:
# block targeting felixgeelhaar/homebrew-tap, but nothing ever ran goreleaser
# -- v1.1.0 was published by hand with zero assets, and the tap's
# Formula/heartbeat.rb still sits at 1.0.0.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

# A tag must produce exactly one release run: two concurrent runs race to
# upload the same asset names and both fail with 422 already_exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # goreleaser derives the changelog from history

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org-level secret, scoped to the repos that publish to the tap. The
          # default GITHUB_TOKEN is confined to THIS repo and cannot push to
          # felixgeelhaar/homebrew-tap; goreleaser's brews: section consumes
          # this to update Formula/heartbeat.rb on every release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
