version: 2

project_name: heartbeat

builds:
  - id: heartbeat
    main: ./cmd/heartbeat/
    binary: heartbeat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

archives:
  - id: heartbeat
    ids:
      - heartbeat
    name_template: "heartbeat_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: heartbeat
    repository:
      owner: klarlabs-studio
      name: homebrew-tap
      # Without this goreleaser falls back to GITHUB_TOKEN, which is
      # scoped to this repo and cannot push to the tap.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/klarlabs-studio/heartbeat"
    description: "MCP server for running team health checks with AI agents"
    license: "MIT"
    # No install:/test: stanzas -- a cask's binary stanza is generated by
    # goreleaser from the archive. The formula's `bin.install` / `system`
    # blocks have no cask equivalent.
